<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=divice-width, initial-scale= 1.0">
        <title>Calculadora de Notas</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
           <div class="card-center">
                <h1>Calculadora de Média</h1>

                <label class="label1"> Primeira nota</label>
                <input type="number" id="nota1" placeholder="Digite sua primeira nota">

                <label class="label2"> Segunda nota</label>
                <input type="number" id="nota2" placeholder="Digite sua segunda nota">
            
                <button onclick="calcular()">Calcular média</button>
           </div>
        </div>
        
        <div id="modal" class="modal">
            <div class="caixa">
                <h2 id="titulo"></h2>
                <p id="resultado"></p>

                <button onclick="calcularNovamente()">Calcular novamente</button>
            </div>
        </div>
        

        <script src="treinando.js"></script>
    </body>
</html>
